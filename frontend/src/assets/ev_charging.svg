<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8f4f2"/>
      <stop offset="100%" stop-color="#fdcfb2"/>
    </linearGradient>

    <!-- Charger Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4e4e4d"/>
      <stop offset="50%" stop-color="#939393"/>
      <stop offset="100%" stop-color="#4e4e4d"/>
    </linearGradient>

    <!-- Neon Purple Charger Accent Glow -->
    <filter id="purpleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- General Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#4e4e4d" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  
  <!-- Tech mesh grid pattern -->
  <line x1="50" y1="0" x2="50" y2="600" stroke="#fcab7a" stroke-width="1" opacity="0.3"/>
  <line x1="750" y1="0" x2="750" y2="600" stroke="#fcab7a" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#fcab7a" stroke-width="1" opacity="0.2"/>

  <!-- EV Charging Pedestal (Central) -->
  <g transform="translate(260, 60)" filter="url(#shadow)">
    
    <!-- Heavy-Duty Metal Post/Pedestal -->
    <path d="M80 360 L200 360 L220 480 L60 480 Z" fill="#2C2C2E" stroke="#4e4e4d" stroke-width="2"/>
    
    <!-- Wallbox Charger Enclosure -->
    <rect x="40" y="0" width="200" height="360" rx="20" fill="url(#bodyGrad)" stroke="#4e4e4d" stroke-width="3"/>
    
    <!-- Inside Glass Faceplate -->
    <rect x="52" y="12" width="176" height="336" rx="12" fill="#1C1C1E"/>

    <!-- Glowing Led Loop Accent -->
    <rect x="62" y="24" width="156" height="180" rx="8" fill="none" stroke="#fc5502" stroke-width="2" stroke-dasharray="120 40" filter="url(#purpleGlow)" opacity="0.8"/>

    <!-- Mock Charger Screen UI -->
    <rect x="74" y="38" width="132" height="100" rx="6" fill="#111827" stroke="rgba(252,85,2,0.3)" stroke-width="1"/>
    
    <!-- Battery Level Symbol -->
    <rect x="100" y="58" width="60" height="28" rx="4" fill="none" stroke="#fc5502" stroke-width="2"/>
    <rect x="162" y="66" width="4" height="12" fill="#fc5502"/>
    <!-- Charge Progress -->
    <rect x="104" y="62" width="38" height="20" rx="2" fill="#fc5502"/>
    
    <!-- Screen Text -->
    <text x="140" y="112" fill="#fcab7a" font-family="Outfit, sans-serif" font-weight="700" font-size="10" text-anchor="middle" letter-spacing="1">CHARGING // 70%</text>
    <text x="140" y="126" fill="#939393" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">7.4 kW ACTIVE AC</text>

    <!-- Dynamic RFID Sensor Icon -->
    <circle cx="140" cy="240" r="28" fill="#2C2C2E" stroke="rgba(252,85,2,0.2)" stroke-width="2"/>
    <!-- RFID waves -->
    <path d="M125 240 A 15 15 0 0 1 155 240" fill="none" stroke="#fc5502" stroke-width="2" stroke-linecap="round" filter="url(#purpleGlow)"/>
    <path d="M130 240 A 10 10 0 0 1 150 240" fill="none" stroke="#fc5502" stroke-width="2" stroke-linecap="round"/>
    <circle cx="140" cy="240" r="3" fill="#fc5502"/>
    <text x="140" y="285" fill="#939393" font-family="Outfit, sans-serif" font-weight="700" font-size="8" text-anchor="middle" letter-spacing="0.5">TAP RFID OR APP</text>

    <!-- Charger Connector Plug/Dock -->
    <!-- Cable Loop -->
    <path d="M30 330 C-30 330 -40 440 80 440" fill="none" stroke="#1C1C1E" stroke-width="18" stroke-linecap="round"/>
    <path d="M30 330 C-30 330 -40 440 80 440" fill="none" stroke="#2C2C2E" stroke-width="12" stroke-linecap="round"/>
    
    <!-- CCS2 Connector Handle DOCKED -->
    <rect x="25" y="270" width="30" height="70" rx="8" fill="#1C1C1E" stroke="#4e4e4d" stroke-width="1" transform="rotate(-15, 40, 300)"/>
    <rect x="20" y="290" width="10" height="40" rx="2" fill="#fc5502" filter="url(#purpleGlow)"/>
  </g>

  <!-- Floating Stats Panel -->
  <g transform="translate(540, 120)" filter="url(#shadow)">
    <rect x="0" y="0" width="180" height="150" rx="12" fill="rgba(78, 78, 77, 0.95)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="36" fill="#fcab7a" font-family="Outfit, sans-serif" font-weight="700" font-size="12" letter-spacing="1">SMART CHARGER</text>
    <text x="24" y="54" fill="#FFFFFF" font-family="Outfit, sans-serif" font-weight="700" font-size="16">OCPP 1.6J Ready</text>
    <line x1="24" y1="72" x2="156" y2="72" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="24" y="96" fill="#939393" font-family="Inter, sans-serif" font-size="10">INTEGRATION</text>
    <text x="24" y="112" fill="#FFFFFF" font-family="Inter, sans-serif" font-size="12" font-weight="700">Solar Canopy compatible</text>
    <text x="24" y="128" fill="#10B981" font-family="Inter, sans-serif" font-size="11" font-weight="700">Dynamic Load Balancing</text>
  </g>
</svg>
