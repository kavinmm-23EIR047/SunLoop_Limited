<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Slate -->
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Glassmorphic card overlay -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2E" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1C1C1E" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Lines Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fc5502"/>
      <stop offset="100%" stop-color="#fa8342"/>
    </linearGradient>

    <!-- Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007AFF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
  </defs>

  <!-- Base Slate Screen Background -->
  <rect width="800" height="600" fill="url(#slateGrad)"/>
  
  <!-- Outer Tablet/Browser Frame -->
  <rect x="2" y="2" width="796" height="596" rx="20" fill="none" stroke="#4e4e4d" stroke-width="4" opacity="0.5"/>
  <!-- Top browser bar dots -->
  <circle cx="30" cy="30" r="6" fill="#EF4444"/>
  <circle cx="50" cy="30" r="6" fill="#F59E0B"/>
  <circle cx="70" cy="30" r="6" fill="#10B981"/>
  
  <text x="400" y="35" fill="#939393" font-family="Outfit, sans-serif" font-weight="700" font-size="12" text-anchor="middle" letter-spacing="1">SUNLOOP AI PORTAL // CLOUD MONITORING</text>
  
  <line x1="0" y1="55" x2="800" y2="55" stroke="#4e4e4d" stroke-width="2"/>

  <!-- Left Sidebar (Mock Navigation) -->
  <rect x="0" y="56" width="80" height="544" fill="#111827" opacity="0.8"/>
  <g transform="translate(25, 80)">
    <!-- Dashboard icon -->
    <rect x="5" y="5" width="20" height="20" rx="4" fill="#fc5502" filter="url(#glow)"/>
    <!-- Analytics icon -->
    <rect x="5" y="45" width="20" height="20" rx="4" fill="#2C2C2E"/>
    <!-- Node configuration icon -->
    <rect x="5" y="85" width="20" height="20" rx="4" fill="#2C2C2E"/>
    <!-- Alert list icon -->
    <rect x="5" y="125" width="20" height="20" rx="4" fill="#2C2C2E"/>
    <!-- Settings icon -->
    <rect x="5" y="480" width="20" height="20" rx="4" fill="#2C2C2E"/>
  </g>

  <!-- Main Content Area Grid -->
  
  <!-- 1. Header node info -->
  <text x="110" y="95" fill="#FFFFFF" font-family="Outfit, sans-serif" font-weight="800" font-size="22">Coimbatore HQ Node</text>
  <text x="110" y="115" fill="#10B981" font-family="Inter, sans-serif" font-size="12" font-weight="700">ONLINE // SYSTEM HEALTH: 98%</text>

  <!-- Top row: Status indicators -->
  
  <!-- Solar production card -->
  <g transform="translate(110, 140)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(252,85,2,0.2)" stroke-width="1"/>
    <text x="20" y="30" fill="#fcab7a" font-family="Outfit, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5">SOLAR GENERATION</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="Outfit, sans-serif" font-weight="800" font-size="28" filter="url(#glow)">125.6 kW</text>
    <circle cx="170" cy="45" r="15" fill="rgba(252,85,2,0.1)"/>
    <circle cx="170" cy="45" r="8" fill="#fc5502"/>
  </g>

  <!-- Battery SOC card -->
  <g transform="translate(330, 140)">
    <rect x="0" y="0" width="200" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(16,185,129,0.2)" stroke-width="1"/>
    <text x="20" y="30" fill="#34D399" font-family="Outfit, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5">BATTERY STORAGE</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="Outfit, sans-serif" font-weight="800" font-size="28" filter="url(#glow)">85% SOC</text>
    <circle cx="170" cy="45" r="15" fill="rgba(16,185,129,0.1)"/>
    <rect x="160" y="38" width="20" height="14" rx="2" fill="none" stroke="#10B981" stroke-width="2"/>
    <rect x="162" y="41" width="12" height="8" fill="#10B981"/>
  </g>

  <!-- EV Load card -->
  <g transform="translate(550, 140)">
    <rect x="0" y="0" width="220" height="90" rx="10" fill="url(#cardGrad)" stroke="rgba(139,92,246,0.2)" stroke-width="1"/>
    <text x="20" y="30" fill="#A78BFA" font-family="Outfit, sans-serif" font-weight="700" font-size="12" letter-spacing="0.5">EV CHARGING LOAD</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="Outfit, sans-serif" font-weight="800" font-size="28" filter="url(#glow)">42.7 kW</text>
    <circle cx="190" cy="45" r="15" fill="rgba(139,92,246,0.1)"/>
    <circle cx="190" cy="45" r="8" fill="#8B5CF6"/>
  </g>

  <!-- Bottom Row: Big analytics Chart Card -->
  <g transform="translate(110, 250)">
    <rect x="0" y="0" width="660" height="310" rx="12" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    
    <!-- Chart Header -->
    <text x="25" y="35" fill="#FFFFFF" font-family="Outfit, sans-serif" font-weight="700" font-size="16">Real-Time Power Analytics (24h)</text>
    
    <!-- Legend -->
    <circle cx="480" cy="28" r="5" fill="#fc5502" filter="url(#glow)"/>
    <text x="492" y="32" fill="#939393" font-family="Inter, sans-serif" font-size="11">Solar</text>
    
    <circle cx="540" cy="28" r="5" fill="#10B981" filter="url(#glow)"/>
    <text x="552" y="32" fill="#939393" font-family="Inter, sans-serif" font-size="11">Storage</text>

    <circle cx="600" cy="28" r="5" fill="#fcab7a" filter="url(#glow)"/>
    <text x="612" y="32" fill="#939393" font-family="Inter, sans-serif" font-size="11">EV Load</text>

    <!-- Grid lines of chart -->
    <line x1="40" y1="70" x2="620" y2="70" stroke="#2C2C2E" stroke-width="1"/>
    <line x1="40" y1="120" x2="620" y2="120" stroke="#2C2C2E" stroke-width="1"/>
    <line x1="40" y1="170" x2="620" y2="170" stroke="#2C2C2E" stroke-width="1"/>
    <line x1="40" y1="220" x2="620" y2="220" stroke="#2C2C2E" stroke-width="1"/>
    <line x1="40" y1="270" x2="620" y2="270" stroke="#4e4e4d" stroke-width="2"/>

    <!-- Y-axis labels -->
    <text x="30" y="74" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="end">150kW</text>
    <text x="30" y="124" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="end">100kW</text>
    <text x="30" y="174" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="end">50kW</text>
    <text x="30" y="224" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="end">0kW</text>
    
    <!-- X-axis labels -->
    <text x="40" y="290" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">06:00</text>
    <text x="136" y="290" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">09:00</text>
    <text x="232" y="290" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">12:00</text>
    <text x="328" y="290" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">15:00</text>
    <text x="424" y="290" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">18:00</text>
    <text x="520" y="290" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">21:00</text>
    <text x="616" y="290" fill="#939393" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">00:00</text>

    <!-- Solar Chart Line (Curve) -->
    <path d="M40 250 Q100 240, 150 140 T300 80 T450 160 T600 260 M600 260 L620 270" fill="none" stroke="#fc5502" stroke-width="3" filter="url(#glow)"/>
    
    <!-- Storage Chart Line (Curve) -->
    <path d="M40 90 Q120 90, 180 120 T300 160 T420 180 T600 110" fill="none" stroke="#10B981" stroke-width="3" filter="url(#glow)"/>

    <!-- EV Load Chart Line (Curve) -->
    <path d="M40 270 Q80 270, 120 220 T200 200 T350 250 T480 180 T620 120" fill="none" stroke="#fcab7a" stroke-width="3" filter="url(#glow)"/>
  </g>
</svg>
